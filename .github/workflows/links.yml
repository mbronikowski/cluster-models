name: Check all links (manual)

# Runs only when started by hand from the Actions tab: one request per host
# every few seconds, so a full run takes several minutes and stays polite.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check every external link
        run: python tools/check_links.py --all --delay 3
      - name: List preprints that have been published
        run: python tools/check_preprints.py
