name: Check data

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate data
        run: python validate.py
      - name: Build the site
        run: python build.py
      - name: Check links added in this pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          BASE: origin/${{ github.base_ref }}
        run: |
          # later pushes to the pull request only check links added since the previous push
          since="$BASE"
          if [ "$ACTION" = synchronize ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            since="$BEFORE"
          fi
          python tools/check_links.py --changed-since "$since"
