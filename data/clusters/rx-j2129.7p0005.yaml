      article will be shared on reasonable request to the corresponding author.
  - title: Caminha et al. (2019)
    program: clash-vlt
    refs: [2019A&A...632A..36C]
    availability: public
    note: |-
      [Caminha et al. (2019)](ref:2019A&A...632A..36C) carried out a detailed strong lensing
      analysis of a sub-sample of eight galaxy clusters of the
      [CLASH](#clash-zitrin-et-al-2015) cluster sample. As of July 2025, the model download
      link in the paper appears defunct; the data can be found in the
      [A&A data products repository](https://cdsarc.cds.unistra.fr/ftp/J/A+A/632/A36/) or
      from the
      [CLASH-VLT lens model webpage](http://www.fe.infn.it/astro/lensing/Caminha2019_SL_models/).
