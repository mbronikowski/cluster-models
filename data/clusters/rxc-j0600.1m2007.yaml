# One file per cluster. Field reference: docs/data-format.md

name: RXC J0600.1-2007
common_names: [Anglerfish Cluster]
aka: [MACS J0600.1-2008]
designations:
  - PSZ1 G225.91-19.98
  - SPT-CL J0600-2007
  - MCXC J0600.1-2007
  - PLCKESZ G225.92-19.99
  - PSZ2 G225.93-19.99
ra: "06:00:08.17"
dec: "-20:08:08.85"
z: 0.46
programs: [relics, venus, alcs, muse-lensing]

models:
  - title: Furtak et al. (2024)
    refs: [2024MNRAS.533.2242F]
    availability: on-request
    note: |-
      [Furtak et al. (2024)](ref:2024MNRAS.533.2242F) have created a mass model based on
      newer data, with an additional bimodal, massive SL structure adjacent to the cluster.
      Data for the publication will be shared by the authors on request.
  - title: 'ALCS: Fujimoto et al. (2021)'
    program: alcs
    refs: [2021ApJ...911...99F]
    data: [ALMA]
    availability: unknown
    tags: [multiple-models]
    note: |-
      Several lens models of the cluster, built as part of the ALMA Lensing Cluster Survey.
  - title: MUSE data release
    program: muse-lensing
    data: [HST, MUSE]
    availability: unknown
    links:
      - label: MUSE release page
        url: https://cral-perso.univ-lyon1.fr/labo/perso/johan.richard/MUSE_data_release/
    note: |-
      The MUSE release page lists this cluster (as MACS0600) with a redshift catalogue and a
      mass-model link, but the model directory was empty in October 2026.
  - title: RELICS
    program: relics
    data: [HST]
    availability: public
    tags: [multiple-models]
    links:
      - label: Lens models (MAST)
        url: https://archive.stsci.edu/hlsps/relics/rxc0600m20/models/

notes: |-
  The position is the core studied by RELICS and the ALMA Lensing Cluster Survey, at the
  galaxy [Furtak et al. (2024)](ref:2024MNRAS.533.2242F) call the South BCG. Their model
  adds a second strong-lensing structure about 2.5-3' to the north-east, around the galaxies
  they label BCG1 and BCG2 (the position used until October 2026), and they nickname the
  system the Anglerfish cluster.
    note: MAST provides models made with glafic and Lenstool.
