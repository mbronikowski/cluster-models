  - title: Mohammed et al. (2015)
    refs: [2015PASJ...67...21M]
    availability: unknown
    note: |-
      [Mohammed et al. (2015)](ref:2015PASJ...67...21M) created a gravitational lensing
      model of the galaxy cluster.
  - title: Oguri et al. (2012)
    refs: [2012MNRAS.420.3213O]
    availability: unknown
    note: |-
      The cluster's lensing properties were studied by
