models:
  - title: Martínez-Arrizabalaga et al. (2024)
    refs: [2024A&A...682A.187M]
    availability: unknown
    tags: [free-form, time-delay-cosmography]
    note: |-
      [Martínez-Arrizabalaga et al. (2024)](ref:2024A&A...682A.187M) created a free-form
      lens model for the galaxy cluster for the purpose of measuring the Hubble constant.
  - title: Perera et al. (2024)
    refs: [2024MNRAS.527.2639P]
    availability: on-request
    tags: [free-form, hybrid, multiple-models]
    note: |-
      [Perera et al. (2024)](ref:2024MNRAS.527.2639P) created an array of free-form and
      hybrid lens models for SDSS J1004+4112. Data generated from the article will be shared
      upon reasonable request to the corresponding author.
  - title: Liu et al. (2023)
    refs: [2023PhRvD.108h3532L]
    availability: unknown
    tags: [time-delay-cosmography]
    note: |-
      The cluster was modeled by [Liu et al. (2023)](ref:2023PhRvD.108h3532L) for the
      purpose of measuring the Hubble constant.
  - title: Napier et al. (2023)
    refs: [2023ApJ...959..134N]
    availability: unknown
    tags: [time-delay-cosmography]
    note: |-
      The cluster was modeled by [Napier et al. (2023)](ref:2023ApJ...959..134N), along with
      SDSS J1029+2623 and SDSS J2222+2745, to obtain a Hubble constant measurement from time
