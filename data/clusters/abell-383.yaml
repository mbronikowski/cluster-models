    note: |-
      Previously, the cluster was studied by [Zitrin et al. (2011)](ref:2011ApJ...742..117Z)
      as part of the CLASH program.
  - title: Newman et al. (2011)
    refs: [2011ApJ...728L..39N]
    availability: unknown
    note: |-
      The cluster was modeled gravitationally by
      [Newman et al. (2011)](ref:2011ApJ...728L..39N).
