name: Abell 1689 CAND-ISAAC
class: supernova
subclass: IIP (photometric)
status: confirmed
images: single
cluster: abell-1689
ra: "13:11:28.01"
dec: "-01:19:25.0"
z: 0.637
refs: [2009A&A...507...71G, 2016A&A...594A..54P]
notes: |-
  Core-collapse supernova behind Abell 1689, one of six in the near-infrared supernova
  searches compiled by [Petrushevska et al. (2016)](ref:2016A&A...594A..54P); the cluster brightens
  it by about 1.4 mag according to the lens models used there. Classified from its light
  curve. Found in the VLT/ISAAC search of Goobar et al. (2009), who estimated z ~ 0.59;
  the host spectrum later gave z = 0.637.
