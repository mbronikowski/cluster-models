notes: |-
  The first multiply-imaged supernova, found in 2014 as an Einstein cross of four images
  around a cluster member galaxy ([Kelly et al. 2015](ref:2015Sci...347.1123K)). Lens
  models predicted a further image about a year later
  ([Treu et al. 2016](ref:2016ApJ...817...60T)), which appeared in December 2015
  ([Kelly et al. 2016a](ref:2016ApJ...819L...8K)). Its time delays gave the first H0
  measurement from a lensed supernova ([Kelly et al. 2023b](ref:2023Sci...380.1322K);
  [Grillo et al. 2024](ref:2024A&A...684L..23G)). The references are papers centred on the
  supernova, its host or the lens models it tested.
