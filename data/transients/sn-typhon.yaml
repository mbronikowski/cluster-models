notes: |-
  Triply-imaged supernova behind Abell 370. Archival HST and JWST imaging covers its
  light curve from 1 to 500 observer-frame days after explosion (2024); the brightest
  image is magnified about 20 times. A DD spectrum was requested for its redshift and type,
  which the H0 measurement needs. Not the same object as the
  [archival supernova](transient:abell-370-archival-sn) of Chen et al. (2022). No paper
  yet; details from the public DD proposal. Position: the brightest image.
