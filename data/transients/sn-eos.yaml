notes: |-
  Spectroscopically confirmed, metal-poor Type II supernova at z = 5.13, found in VENUS
  JWST imaging in September 2025 ([Coulter et al. 2026](ref:2026arXiv260104156C)). The
  VENUS lens model of [Allingham et al. (2026)](ref:2026ApJ..1005..215A) predicts five
  images; the observed radial pair is magnified 25-30 times with a delay of under five
  days. Its ultra-faint host is studied by
  [Asada et al. (2026)](ref:arXiv:2607.14355). Position: image 1.
