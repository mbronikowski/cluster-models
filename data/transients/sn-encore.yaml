notes: |-
  Second multiply-imaged supernova in MRG-M0138 (z = 1.95), after
  [SN Requiem](transient:sn-requiem), found in JWST imaging in November 2023
  ([Pierel et al. 2024b](ref:2024ApJ...967L..37P)). The "Cosmology with supernova Encore"
  series covers the MUSE spectroscopy ([Granata et al. 2025](ref:2025A&A...697A..94G)),
  the GLEE lens models ([Ertl et al. 2025](ref:2025A&A...702A.157E)), the time delays
  ([Pierel et al. 2026](ref:2026ApJ...998..219P)) and the blind comparison of lens models
  with the resulting H0 ([Suyu et al. 2026](ref:2026A&A...708A.291S)).
