refs: [2024ApJ...967L..37P, 2024MNRAS.535.2939D, 2025A&A...697A..94G, 2025A&A...699A.101A, 2025A&A...702A.157E, 2026ApJ...998..219P, 2026A&A...708A.291S, arXiv:2606.25205]
