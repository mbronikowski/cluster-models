# Lensed transient / variable source. Field reference: docs/data-format.md

name: Abell 370 archival SN
class: supernova
subclass: CCSN
status: confirmed
cluster: abell-370
refs: [2022Natur.611..256C]
notes: |-
  Archival multiply-imaged supernova in _Hubble Space Telescope_ images from 2010, in a
  galaxy at photometric z ~ 2.9 ([Chen et al. 2022](ref:2022Natur.611..256C)). The three
  images show it at different times after explosion; the early light curve matches shock
  cooling of a red-supergiant progenitor. No spectral type was measured.
