notes: |-
  Type Ia supernova in a galaxy at z = 1.522 that RX J2129.7+0005 lenses into three
  images; it was seen in the last-arriving image, with the other two predicted to have
  passed roughly 320 and 1000 days earlier. JWST/NIRSpec spectroscopy confirmed the type,
  and the magnification of the observed image (about 5) was measured from the light curve
  and compared with six lens models
  ([Dhanasingham et al. 2026](ref:2026ApJ..1008..230D)).
